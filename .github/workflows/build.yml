name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q "$(ls *.zip | head -n1)" -d work
          GR=$(find work -name gradlew -not -path "*/node_modules/*" | head -n1)
          echo "PROJECT_DIR=$(dirname "$GR")" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: XFileExplorer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
